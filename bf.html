<!doctype html>
<html lang="zh-CN">
<head>
<script>(function(){var t=localStorage.getItem("bf-theme");if(t)document.documentElement.dataset.theme=t})()</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>黑五好物 2026 · 生活404</title>
<link rel="canonical" href="https://hei5.life404.cc/">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23ff7c00'/%3E%3Ctext x='32' y='50' text-anchor='middle' font-family='Arial Black,Arial,Helvetica,sans-serif' font-weight='900' font-size='50' fill='%23111'%3E5%3C/text%3E%3C/svg%3E">
<meta property="og:url" content="https://hei5.life404.cc/">
<meta name="description" content="2026 黑色星期五 / 网络星期一 VPS、eSIM、域名、AI 软件与数码好物汇总，只收官方已公布的优惠。">
<style>
:root{--bg:#fbf8f4;--card:#fff;--line:#eee6dc;--txt:#1f1a15;--mut:#7d7268;--acc:#ff7c00;--acc-soft:#fff1e3;--accd:#e56a00;
--sh:0 1px 2px rgba(120,70,20,.06),0 8px 24px -12px rgba(120,70,20,.18);--e:cubic-bezier(.25,1,.5,1)}
:root[data-theme=dark]{--bg:#16130f;--card:#1f1b16;--line:#2f2922;--txt:#f1ebe4;--mut:#a39789;--acc:#ff8a1f;--acc-soft:#2e2116;--accd:#ff9d45;--sh:none}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#16130f;--card:#1f1b16;--line:#2f2922;--txt:#f1ebe4;--mut:#a39789;--acc:#ff8a1f;--acc-soft:#2e2116;--accd:#ff9d45;--sh:none}}
body,.c,.tabs button,input,.cd div{transition:background-color .3s,color .3s,border-color .3s}
.tg{background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:99px;width:36px;height:36px;font-size:16px;cursor:pointer;display:grid;place-items:center}
.tg:active{transform:scale(.94)}
.cd b.s{color:var(--acc)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.7 -apple-system,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}
.hero{max-width:1180px;margin:0 auto;padding:64px 20px 36px;display:grid;grid-template-columns:1fr auto;gap:24px;align-items:end}
.tag{display:inline-block;background:var(--acc);color:#fff;border-radius:4px;padding:2px 10px;font-size:11px;font-weight:700;letter-spacing:.14em}
h1{font-size:clamp(40px,7.5vw,76px);margin:16px 0 10px;letter-spacing:-.04em;line-height:1.02;font-weight:800}
h1 b{color:var(--acc)}
.sub{color:var(--mut);max-width:34em;margin:0}
.big{font-size:clamp(90px,16vw,180px);font-weight:800;line-height:.85;letter-spacing:-.06em;color:var(--acc);text-align:right}
.big small{display:block;font-size:13px;letter-spacing:.1em;color:var(--mut);font-weight:600;margin-top:10px}
.cd{margin-top:22px;display:flex;gap:8px}
.cd div{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 12px;min-width:64px;box-shadow:var(--sh)}
.cd b{display:block;font-size:22px;font-variant-numeric:tabular-nums;font-weight:800}
.cd span{font-size:11px;color:var(--mut)}
.bar{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%)}
.bar .in{max-width:1180px;margin:0 auto;padding:12px 16px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tabs{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.tabs button{background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:99px;padding:6px 14px;font:inherit;font-size:14px;cursor:pointer;transition:all .2s var(--e)}
.tabs button:hover{border-color:var(--acc)}
.tabs button:active,.go:active{transform:scale(.97)}
.tabs button.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.tabs button i{font-style:normal;opacity:.6;margin-left:4px;font-size:12px}
input{background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:99px;padding:7px 16px;font:inherit;font-size:14px;width:220px;outline:none}
input:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
main{max-width:1180px;margin:0 auto;padding:18px 16px 64px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.c{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--sh);transition:transform .25s var(--e),border-color .25s var(--e)}
.c:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--acc) 45%,var(--line))}
.top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.cat{font-size:11px;color:var(--accd);background:var(--acc-soft);border-radius:4px;padding:1px 7px;white-space:nowrap;font-weight:600}
.n{font-weight:700;font-size:16px;line-height:1.35;letter-spacing:-.01em}
.spec{color:var(--mut);font-size:13px}
.p{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.p b{font-size:26px;color:var(--acc);letter-spacing:-.02em;font-weight:800}
.p s{color:var(--mut);font-size:13px}
.note{font-size:14px}
.meta{font-size:12px;color:var(--mut);display:flex;flex-direction:column;gap:2px}
.codes{display:flex;flex-wrap:wrap;gap:8px 14px}.code{display:flex;gap:6px;align-items:center}.cl{font-size:12px;color:var(--mut)}
.code code{background:var(--acc-soft);border:1px dashed var(--acc);border-radius:4px;padding:1px 8px;color:var(--accd);font-size:13px;font-weight:600}
.code button{background:none;border:1px solid var(--line);color:var(--mut);border-radius:4px;font-size:12px;cursor:pointer;padding:2px 8px}
.go{margin-top:auto;display:block;text-align:center;background:var(--acc-soft);color:var(--accd);border-radius:10px;padding:9px;text-decoration:none;font-weight:700;transition:all .2s var(--e)}
.go:hover{background:var(--acc);color:#fff}
.empty{color:var(--mut);text-align:center;padding:40px}
.rn{max-width:1180px;margin:8px auto 20px;padding:0 16px;text-align:center}.rn a{display:inline-block;line-height:0;border-radius:8px;overflow:hidden;opacity:.92;transition:opacity .2s}.rn a:hover{opacity:1}.rn img{max-width:100%;height:auto}.rn small{display:block;margin-top:4px;font-size:11px;color:var(--mut)}
footer{max-width:1180px;margin:0 auto;padding:0 16px 48px;color:var(--mut);font-size:12px;line-height:1.9}
@media(max-width:640px){.hero{grid-template-columns:1fr;padding-top:40px}.big{text-align:left}input{width:100%}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="hero"><div>
  <span class="tag">BLACK FRIDAY · CYBER MONDAY 2026</span>
  <h1>黑五<b>好物</b>清单</h1>
  <p class="sub">VPS、eSIM、域名、AI 软件、数码配件。只收商家官方已公布的优惠，价格以官网为准。</p>
  <div class="cd" id="cd"></div></div>
  <div class="big">11.27<small>BLACK FRIDAY · 美东时间</small></div>
</header>
<div class="bar"><div class="in">
  <div class="tabs" id="tabs"></div>
  <input id="q" placeholder="搜索：iPhone / 9929 / Airalo…">
  <button class="tg" id="tg" title="切换浅色/深色" aria-label="切换主题"></button>
</div></div>
<main><div class="grid" id="grid"></div></main>
<div class="rn"><a href="https://my.racknerd.com/aff.php?aff=4338" target="_blank" rel="sponsored noopener"><picture><source media="(max-width:640px)" srcset="https://racknerd.com/banners/320x100.gif"><img src="https://racknerd.com/banners/728x90.gif" width="728" height="90" alt="RackNerd VPS" loading="lazy"></picture></a><small>广告</small></div>
<footer id="ft"></footer>
<script>
const BF=new Date("2026-11-27T00:00:00-05:00"), CM=new Date("2026-12-01T00:00:00-05:00");
function cd(){const n=new Date();let t=BF-n,l="距黑五";if(t<0){t=CM-n;l="距网一结束"}if(t<0){document.getElementById("cd").innerHTML="<div><b>已结束</b><span>明年见</span></div>";return}
const p=x=>String(x).padStart(2,"0"),d=Math.floor(t/864e5),h=Math.floor(t/36e5)%24,m=Math.floor(t/6e4)%60,s=Math.floor(t/1e3)%60;
document.getElementById("cd").innerHTML=`<div><b>${d}</b><span>${l} 天</span></div><div><b>${p(h)}</b><span>小时</span></div><div><b>${p(m)}</b><span>分钟</span></div><div><b class="s">${p(s)}</b><span>秒</span></div>`}
cd();setInterval(cd,1000);
const tg=document.getElementById("tg");
function isDark(){const t=document.documentElement.dataset.theme;return t?t=="dark":matchMedia("(prefers-color-scheme: dark)").matches}
function tgIcon(){tg.textContent=isDark()?"☀️":"🌙"}
tg.onclick=()=>{const nt=isDark()?"light":"dark";document.documentElement.dataset.theme=nt;localStorage.setItem("bf-theme",nt);tgIcon()};
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",tgIcon);tgIcon();
const esc=s=>String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let all=[],cat="全部";
fetch("/deals.json").then(r=>r.json()).then(j=>{all=j.items;document.getElementById("ft").innerHTML=`更新于 ${esc(j.updated)} · 共 ${all.length} 条 · 优惠信息整理自各商家官网与公告，价格、库存随时变化，下单前请以官网为准。部分商家链接含站长推荐码（RackNerd、搬瓦工、Saily），不影响价格。<br>生活404 · 运行在德国 Nodaroo`;tabs();draw()});
function tabs(){const cats=["全部",...new Set(all.map(x=>x.cat))];document.getElementById("tabs").innerHTML=cats.map(c=>`<button class="${c==cat?"on":""}" data-c="${esc(c)}">${esc(c)}<i>${c=="全部"?all.length:all.filter(x=>x.cat==c).length}</i></button>`).join("");
document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>{cat=b.dataset.c;tabs();draw()})}
function draw(){const q=document.getElementById("q").value.trim().toLowerCase();
const L=all.filter(x=>(cat=="全部"||x.cat==cat)&&(!q||JSON.stringify(x).toLowerCase().includes(q)));
document.getElementById("grid").innerHTML=L.length?L.map(x=>`<div class="c">
<div class="top"><div class="n">${esc(x.name)}</div><span class="cat">${esc(x.cat)}</span></div>
${x.spec?`<div class="spec">${esc(x.spec)}</div>`:""}
<div class="p"><b>${esc(x.price)}</b>${x.orig?`<s>${esc(x.orig)}</s>`:""}</div>
${x.note?`<div class="note">${esc(x.note)}</div>`:""}
${x.code||x.ref?`<div class="codes">${[[x.code,x.ref?"黑五码":""],[x.ref,"邀请码"]].filter(c=>c[0]).map(c=>`<div class="code">${c[1]?`<span class="cl">${c[1]}</span>`:""}<code>${esc(c[0])}</code><button onclick="navigator.clipboard.writeText('${esc(c[0])}');this.textContent='已复制'">复制</button></div>`).join("")}</div>`:""}
<div class="meta">${x.region?`<span>📍 ${esc(x.region)}</span>`:""}${x.ends?`<span>⏳ ${esc(x.ends)}</span>`:""}</div>
<a class="go" href="${esc(x.url)}" target="_blank" rel="noopener nofollow">去看看 →</a></div>`).join(""):`<div class="empty">没找到，换个词试试</div>`}
document.getElementById("q").oninput=draw;
</script>
</body>
</html>
